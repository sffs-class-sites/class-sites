      - page: home
        embed: school-hours   # swapped from the pasted copy 2026-11-08; re-placed by Ahin the same afternoon, then tools/sites_editor.py resize (1154 x 677 -> 1154 x 772, one drag) and publish; live check PASS: 1154 x 772 desktop, 352 x 235 iPhone; back to card 2026-11-11 after the Home rearrangement reset it
        query: {class: 2034}
