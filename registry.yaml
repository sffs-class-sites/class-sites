# Which embed goes where. tests/monitor.py reads this file and builds the status page.
#
# type: url  -> the Sites slot holds our GitHub Pages URL; content updates automatically.
# type: code -> lives only as pasted code on a Site (nothing on Pages); we track its hash.
# match: text that identifies this embed in a Site's HTML (URL embeds are found by their Pages URL).
# live: the site's root URL; a slot's page is live + page.
# status: url (placed by URL) | pasted-code (old copy; hash = sha256 of the pasted code, first 12 hex)
#         | code (pasted by design, for type: code embeds; hash as for pasted-code).
# query: the query string the embed is placed with (e.g. class: 2034 for ?class=2034); none = placed bare.
#        tests/live_check.py fails if the Site's frame carries a different one (wrong class).
# box: editor-canvas size, measured at a 1440px window. Only its shape (h / w) carries over:
#      published width is Sites' content column (max 1154px), height = width × h / w (CLAUDE.md §0 #1).
#
# Sites are keyed by graduating class, not grade (CLAUDE.md §1): a site follows its class
# for nine years. The grade in each `name` and `live` URL is today's and goes stale at
# rollover (CLAUDE.md §9 items 2–3).

# Standard editor boxes (CLAUDE.md §5). Place every slot at `card`; use `page` only for an embed that is the
# only thing on its page. CI checks every shared embed at `card` on a phone (352 × 235), so a box is never
# tuned per embed. A slot's `box` is one of these names, or {w, h} where a live box still differs.
boxes:
  card: {w: 935, h: 625}   # h/w 0.668: publishes 1154 x 770 on a desktop, 352 x 235 on an iPhone 13
  page: {w: 935, h: 875}   # h/w 0.936: publishes 1154 x 1080 on a desktop, 352 x 329 on an iPhone 13

embeds:
  important-dates:
    type: url
    path: shared/important-dates/
    owner: platform
    match: "@sffs-calendar"
  room-parents:
    type: url
    path: shared/room-parents/   # placed with ?class=YYYY (pattern A: names come from the master sheet's Live tab at deploy time)
    owner: platform
  updates:
    type: url
    path: shared/updates/        # placed with ?class=YYYY; on the 1st-grade site since 2026-11-02 (docs/updates-pipeline.md)
    owner: platform
  hoops-2034-2027-winter:
    type: code                   # pasted by design until ROADMAP C5 makes a URL team-schedule embed; source and build: teams/class-2034/hoops-2027-winter/
    owner: platform
    match: "@sffs-1st-hoops"     # the .ics UID domain inside the pasted code

sites:
  class-2032:            # 3rd grade in 2026–27
    name: 3rd Grade Class Page
    site_id: 1x30kZaz22W2SSzdL3fTxNm0jbSVyKWo9
    live: https://sites.google.com/sffriendsschool.org/sffs-3rd-class-page
    slots:
      - page: home
        embed: important-dates
        box: card             # resized to the standard 935 x 625 and measured 2026-10-31: 4 dates visible on an iPhone
        status: url           # swapped 2026-10-30
  class-2034:            # 1st grade in 2026–27
    name: 1st Grade Class Page
    site_id: 1vqA_IFOx0oCDUi95RtQ-PPo-3LcD_szY
    live: https://sites.google.com/sffriendsschool.org/sffs-1st-class-page
    slots:
      - page: home
        embed: important-dates
        box: card             # resized to the standard 935 x 625 and measured 2026-10-31: 4 dates visible on an iPhone
        status: url           # swapped 2026-10-30
      - page: resources/basketball
        embed: hoops-2034-2027-winter   # Super Friends winter 2027 schedule, pasted by Ahin 2026-10-29; the monitor goes amber if the pasted code is edited
        status: code
        hash: b627556d43b0    # sha256 of the pasted code, first 12 hex; equals teams/class-2034/hoops-2027-winter/1st-hoops-embed.html (checked 2026-11-03)
      - page: email-digest
        embed: updates
        query: {class: 2034}
        box: page             # the only thing on its page; 352 x 329 on an iPhone shows the first card's title/date/summary/action (placed by Ahin, measured 2026-11-02)
        status: url
      - page: home
        embed: room-parents   # under the welcome text; replaced the pasted glitter list 2026-10-31
        query: {class: 2034}
        box: card             # at card since 2026-11-02: tools/sites_editor.py resize took it from h/w 0.586 to 0.669, Ahin published; live 1154 x 772 desktop, 352 x 235 iPhone (live check 2026-11-03, no drift)
        status: url
