name: Build, check, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 14 * * *"   # daily: refresh the status page (tests/monitor.py)

permissions:
  contents: read

# Pull requests run in their own group each (a new push cancels that PR's older run). Pushes to
# main and the daily run share one group, so Pages deployments stay in order. Before 2026-11-08
# every run shared one group: a PR's build waited behind main's deploy, and a queued PR build was
# cancelled whenever another run joined the queue (GitHub keeps one pending run per group), which
# left that PR without its required check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_DRIVE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    outputs:
      monitor-status: ${{ steps.monitor.outputs.status }}
      monitor-broken: ${{ steps.monitor.outputs.broken }}
      shot-desktop: ${{ steps.shot-desktop.outputs.artifact-url }}
      shot-tablet: ${{ steps.shot-tablet.outputs.artifact-url }}
      shot-phone: ${{ steps.shot-phone.outputs.artifact-url }}
      shot-phone-tall: ${{ steps.shot-phone-tall.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup   # Python 3.12, requirements.txt, Chromium (all cached)
        with:
          chromium: "true"

      - name: Validate data against source calendar
        run: python3 tests/validate_important_dates.py

      - name: Validate the Updates ledger (shape, dates, no personal data)
        run: python3 tests/validate_updates.py

      - name: Unit tests (Site Map fails closed, class model, email fetch, pending emails, deploy emails)
        run: |
          python3 tests/test_site_map.py
          python3 tests/test_classinfo.py
          python3 tests/test_fetch_school_email.py
          python3 tests/test_pending_emails.py
          python3 tests/test_notify_changes.py
          python3 tests/test_notify_deploy.py

      - name: Build embeds
        run: |
          python3 build/build_important_dates.py
          python3 build/build_room_parents.py
          python3 build/build_updates.py
          python3 build/build_school_hours.py
          python3 build/build_team_schedule.py
          python3 build/build_key_systems.py

      # Pattern A (CLAUDE.md §3): personal data is fetched at deploy time and never committed.
      # Writes nothing unless the Site Map marks room-parents publishable. An invalid Live tab
      # fails the build, so the previous deployment stays up rather than a partial list.
      - name: Room parents extract
        if: github.event_name != 'pull_request' && env.HAS_DRIVE_KEY == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 build/extract_room_parents.py --sheet

      # Status page at /status/. Checks the live Sites, not this change, so it never blocks a deploy.
      - name: Monitor live sites
        id: monitor
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tests/monitor.py

      - name: Render check in a Google Sites-style sandbox (desktop, tablet, phone)
        run: python3 tests/render_check.py

      - name: Room parents checks (fake data; extract, Apps Script validation, embed states)
        run: python3 tests/room_parents_check.py

      - name: Updates embed check (tabs, grade picker, class rollover, phone first view)
        run: python3 tests/updates_check.py

      - name: School hours check (data file, grade row highlight, phone first view)
        run: python3 tests/school_hours_check.py

      - name: Team schedule check (frozen UIDs, next game first, calendar adds, phone first view)
        run: python3 tests/team_schedule_check.py

      - name: Key school systems check (data file, collapsible header, links open new tabs, phone first view)
        run: python3 tests/key_systems_check.py

      - name: Live check self-test (fake Site built from this build; the real Sites are checked daily)
        run: python3 tests/live_check.py --mock

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-screenshots
          path: _harness/*.png

      # One unzipped file per screenshot, so the PR comment can link straight to each image.
      - name: Upload desktop screenshot
        id: shot-desktop
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: _harness/shot-desktop.png
          archive: false
          if-no-files-found: warn

      - name: Upload tablet screenshot
        id: shot-tablet
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: _harness/shot-tablet.png
          archive: false
          if-no-files-found: warn

      - name: Upload phone screenshot
        id: shot-phone
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: _harness/shot-phone.png
          archive: false
          if-no-files-found: warn

      - name: Upload phone-tall screenshot
        id: shot-phone-tall
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: _harness/shot-phone-tall.png
          archive: false
          if-no-files-found: warn

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Plain-English summary + screenshot links, as one comment that is updated on every push.
  # Not a required check. Skipped for PRs from forks, whose token cannot comment.
  pr-comment:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # HEAD is the PR merged into its base; HEAD^1 is the base

      - name: Write the summary
        env:
          SHOT_DESKTOP: ${{ needs.build.outputs.shot-desktop }}
          SHOT_TABLET: ${{ needs.build.outputs.shot-tablet }}
          SHOT_PHONE: ${{ needs.build.outputs.shot-phone }}
          SHOT_PHONE_TALL: ${{ needs.build.outputs.shot-phone-tall }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git show HEAD^1:shared/important-dates/data.json > "$RUNNER_TEMP/base.json" 2>/dev/null || : > "$RUNNER_TEMP/base.json"
          python3 tests/pr_summary.py --base "$RUNNER_TEMP/base.json" --head shared/important-dates/data.json \
            --files "$(git diff --name-only HEAD^1 HEAD)" --run-url "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none

  # PRs from the pipeline and from Claude merge themselves once the required build check passes
  # (CLAUDE.md §4 "Who merges"): the email-log index (email-log-auto), the extraction routine's
  # ledger changes (updates-auto), and since 2026-11-06 any PR opened by SFQuakerBot or carrying
  # Claude Code's footer, code, workflows and instructions included (Ahin's decision: CI is the
  # gate, the deploy email is the review, rollback is a revert). Never a PR from a fork. The
  # repo's auto-merge setting is off, so this merges explicitly, as SFQuakerBot
  # (SYNC_BOT_TOKEN). A failed build never reaches this job, and a human can still close the PR.
  automerge:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (contains(fromJSON('["email-log-auto", "updates-auto"]'), github.event.pull_request.head.ref)
          || github.event.pull_request.user.login == 'SFQuakerBot'
          || contains(github.event.pull_request.body, 'Generated with [Claude Code]'))
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SYNC_BOT_TOKEN is not set; leaving the PR for a person." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # The check result can take a moment to register after this job starts.
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
              echo "Merged #$PR." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 20
          done
          echo "Could not merge #$PR; see the log. The PR stays open." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Opens one issue for Ahin while the monitor shows something broken (red); closes it when fixed.
  monitor-alert:
    if: always() && github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS: ${{ needs.build.outputs.monitor-status }}
      BROKEN: ${{ needs.build.outputs.monitor-broken }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Alert
        run: |
          if [ "$STATUS" = red ]; then result=fail; msg="Broken: $BROKEN"
          elif [ -z "$STATUS" ]; then result=fail; msg="The monitor didn't report: it crashed, or the build failed before it ran."
          else result=pass; msg=""; fi
          printf '%s\n\nStatus page: https://sffs-class-sites.github.io/class-sites/status/\nRun: %s\n' "$msg" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          .github/scripts/alert.sh "Class sites monitor: something is broken" "$result" "$RUNNER_TEMP/body.md"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After a push to main deploys, email Ahin what changed: on the Updates page (new or updated
  # topics, the emails read, links to the full text and to the page; build/notify_changes.py)
  # and, for anything else, the PR's title, summary and files (build/notify_deploy.py). Decided
  # 2026-11-05/06: these emails are the review. Sent from the bot's Gmail
  # (BOT_GMAIL_APP_PASSWORD, SMTP) to the UPDATES_NOTIFY_TO variable. Quiet when nothing changed.
  notify:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BEFORE: ${{ github.event.before }}
      BOT_GMAIL_APP_PASSWORD: ${{ secrets.BOT_GMAIL_APP_PASSWORD }}
      UPDATES_NOTIFY_TO: ${{ vars.UPDATES_NOTIFY_TO }}
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Email what was deployed (anything but the ledger)
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "Previous commit unknown; nothing to compare." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -z "$BOT_GMAIL_APP_PASSWORD" ] || [ -z "$UPDATES_NOTIFY_TO" ]; then
            python3 build/notify_deploy.py --before "$BEFORE" --run-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 build/notify_deploy.py --before "$BEFORE" --run-url "$RUN_URL" --send | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Email the Updates change summary
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then exit 0; fi
          if git diff --quiet "$BEFORE" HEAD -- shared/updates/data.json shared/updates/sources.json; then
            echo "Updates ledger and index unchanged; no ledger email." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git show "$BEFORE:shared/updates/data.json" > "$RUNNER_TEMP/base-data.json" 2>/dev/null || : > "$RUNNER_TEMP/base-data.json"
          git show "$BEFORE:shared/updates/sources.json" > "$RUNNER_TEMP/base-sources.json" 2>/dev/null || : > "$RUNNER_TEMP/base-sources.json"
          if [ -z "$BOT_GMAIL_APP_PASSWORD" ] || [ -z "$UPDATES_NOTIFY_TO" ]; then
            echo "Not configured: needs the BOT_GMAIL_APP_PASSWORD secret and the UPDATES_NOTIFY_TO variable. The summary is below instead." >> "$GITHUB_STEP_SUMMARY"
            python3 build/notify_changes.py --base-data "$RUNNER_TEMP/base-data.json" --base-sources "$RUNNER_TEMP/base-sources.json" \
              --pages-url "${PAGES_URL:-https://sffs-class-sites.github.io/class-sites/}" --out "$RUNNER_TEMP/mail.txt"
          else
            python3 build/notify_changes.py --base-data "$RUNNER_TEMP/base-data.json" --base-sources "$RUNNER_TEMP/base-sources.json" \
              --pages-url "${PAGES_URL:-https://sffs-class-sites.github.io/class-sites/}" --out "$RUNNER_TEMP/mail.txt" --send
          fi
          { echo '```'; cat "$RUNNER_TEMP/mail.txt" 2>/dev/null || echo "(no email: nothing to report)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
