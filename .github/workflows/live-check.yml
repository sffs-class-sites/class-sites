name: Live Sites check

# Opens every published Google Site in registry.yaml, measures every registered embed slot
# (size, shape, ?class=, version) and clicks inside Important Dates. Runs in Actions (no Claude),
# daily and on demand. A missing or wrong-class embed opens one issue for Ahin; a drifted box or
# a room parent's own blocks are listed in the report and never alert.
on:
  schedule:
    - cron: "17 15 * * *"   # 08:17 Pacific (07:17 in winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chromium is cached between runs, keyed on the Playwright version (2026-11-06: the
      # download took 17s all day, then 9.5 minutes for three builds in a row during a slow
      # evening at GitHub's end). On a hit only the OS packages are installed, a few seconds.
      - name: Install Playwright
        id: pw
        run: |
          pip install playwright
          # pip's metadata, not playwright.__version__ (the package does not define it: the first
          # cached build's key came out as "playwright-chromium-Linux-", 2026-11-06)
          echo "version=$(pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Measure every registered slot on the published Sites
        id: check
        run: |
          pip install pyyaml
          python3 tests/live_check.py

      - name: Report
        if: always()
        run: |
          mkdir -p _live
          [ -f _live/report.md ] || echo "The check crashed before writing a report." > _live/report.md
          cat _live/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Run with screenshots](%s)\n' "$RUN_URL" >> _live/report.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-check
          path: _live/

      - name: Alert
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh "Live Sites check failing" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" _live/report.md
