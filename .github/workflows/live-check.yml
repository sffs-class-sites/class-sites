name: Live scratch-Site check

# Opens the published scratch Google Site and clicks inside the Important Dates embed.
# Runs in Actions (no Claude), daily and on demand. A failure opens one issue for Ahin.
on:
  schedule:
    - cron: "17 15 * * *"   # 08:17 Pacific (07:17 in winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check the embed on the published Site
        id: check
        run: python3 tests/live_check.py

      - name: Report
        if: always()
        run: |
          mkdir -p _live
          [ -f _live/report.md ] || echo "The check crashed before writing a report." > _live/report.md
          cat _live/report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Run with screenshots](%s)\n' "$RUN_URL" >> _live/report.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-check
          path: _live/

      - name: Alert
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh "Live scratch-Site check failing" "${{ steps.check.outcome == 'success' && 'pass' || 'fail' }}" _live/report.md
